name: security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  APTOS_VERSION: 9.4.0
  APTOS_ARCHIVE_SHA256: 3ece064e072e8ffa1cf15c97d3535ce88486446c0e7d97490f15fc9683884581

jobs:
  rust-and-move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install pinned Aptos CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 --output /tmp/aptos.zip "https://github.com/aptos-labs/aptos-core/releases/download/aptos-cli-v$APTOS_VERSION/aptos-cli-$APTOS_VERSION-Ubuntu-24.04-x86_64.zip"
          echo "$APTOS_ARCHIVE_SHA256  /tmp/aptos.zip" | sha256sum --check -
          unzip -q /tmp/aptos.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/aptos"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify locked dependency graph
        run: cargo metadata --format-version 1 --locked --no-deps
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust and generated Move packages
        run: cargo test --workspace --all-targets --locked
      - name: Test stateful replay gatekeeper
        run: aptos move test --package-dir examples/stateful-gatekeeper
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Enforce dependency policy
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
